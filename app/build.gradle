plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
}

android {
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }

    defaultConfig {
        applicationId "com.cooper.wheellog"
        minSdk 21
        targetSdk 35
        versionCode 129
        versionName "3.2.8b"
        buildConfigField 'String', 'BUILD_TIME', "\"" + new Date().format('HH:mm dd.MM.yyyy') + "\""
        buildConfigField 'String', 'BUILD_DATE', "\"" + new Date().format('dd.MM.yyyy') + "\""
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildTypes.configureEach { buildType ->
        def props = new Properties()
        def propsPath = "../local.properties"
        if (file(propsPath).exists()) {
            file(propsPath).withInputStream { stream -> props.load(stream) }
        }
        def ec_token = System.getProperty("ec_accessToken") ?: props.getProperty('ec_accessToken') ?: ""
        def metrica  = System.getProperty("metrica_api")    ?: props.getProperty('metrica_api')    ?: ""
        buildType.buildConfigField 'String', 'ec_accessToken', "\"" + ec_token + "\""
        buildType.buildConfigField 'String', 'metrica_api',    "\"" + metrica  + "\""
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.3"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
        unitTests.all {
            jvmArgs '-Xmx2g'
        }
    }
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }
    lint {
        abortOnError false
        disable 'ComposableNaming'
    }
    namespace 'com.cooper.wheellog'
}

dependencies {
    implementation project(path: ':shared')

    // Compose
    implementation libs.compose.foundation
    implementation libs.compose.runtime
    implementation libs.compose.runtime.livedata
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling
    implementation libs.compose.material3
    implementation libs.compose.navigation
    implementation libs.compose.material.icons

    // Lifecycle / ViewModel
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.ktx

    // Room
    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    // EUC BLE
    implementation libs.euc.ble.library

    // AndroidX
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.material
    implementation libs.gridlayout
    implementation libs.preference.ktx
    implementation libs.constraintlayout
    implementation libs.legacy.support.v4

    // Kotlin
    implementation libs.kotlin.stdlib
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    // Koin
    implementation platform(libs.koin.bom)
    implementation libs.koin.android
    implementation libs.koin.compose

    // Network / server
    implementation libs.okhttp
    implementation libs.nanohttpd

    // UI
    implementation libs.timber
    implementation libs.osmdroid
    implementation libs.mpandroidchart
    implementation libs.circleindicator
    implementation libs.guava

    // Test
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.junit.jupiter
    testImplementation libs.mockk
    testImplementation libs.robolectric
    testImplementation libs.test.core
    testImplementation libs.kotlin.reflect
    testImplementation libs.mockwebserver
    testImplementation libs.json
    testImplementation libs.koin.test
}
