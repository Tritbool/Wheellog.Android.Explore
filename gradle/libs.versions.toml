[versions]
kotlin            = "2.4.0"
agp               = "9.2.1"
ksp               = "2.2.10-2.0.2"
compose           = "1.11.3"
compose-material3 = "1.4.0"
compose-material  = "1.7.8"
compose-navigation= "2.9.8"
lifecycle         = "2.11.0"
room              = "2.8.4"
material          = "1.14.0"
appcompat         = "1.7.1"
core-ktx          = "1.19.0"
coroutines        = "1.11.0"
koin              = "4.2.2"
okhttp            = "5.4.0"
timber            = "5.0.1"
osmdroid          = "6.1.20"
mpandroidchart    = "v3.1.0"
circleindicator   = "2.1.6"
guava             = "33.6.0-jre"
gridlayout        = "1.1.0"
preference        = "1.2.1"
constraintlayout  = "2.2.1"
legacy-support    = "1.0.0"
euc-ble           = "0.0.4"
# test
junit             = "4.13.2"
truth             = "1.4.5"
junit-jupiter     = "6.1.0"
mockk             = "1.14.11"
robolectric       = "4.16.1"
test-core         = "1.7.0"
json              = "20260522"

[libraries]
# AndroidX
core-ktx                    = { module = "androidx.core:core-ktx",                        version.ref = "core-ktx" }
appcompat                   = { module = "androidx.appcompat:appcompat",                   version.ref = "appcompat" }
material                    = { module = "com.google.android.material:material",           version.ref = "material" }
gridlayout                  = { module = "androidx.gridlayout:gridlayout",                version.ref = "gridlayout" }
preference-ktx              = { module = "androidx.preference:preference-ktx",            version.ref = "preference" }
constraintlayout            = { module = "androidx.constraintlayout:constraintlayout",    version.ref = "constraintlayout" }
legacy-support-v4           = { module = "androidx.legacy:legacy-support-v4",             version.ref = "legacy-support" }
# Compose
compose-foundation          = { module = "androidx.compose.foundation:foundation",        version.ref = "compose" }
compose-runtime             = { module = "androidx.compose.runtime:runtime",              version.ref = "compose" }
compose-runtime-livedata    = { module = "androidx.compose.runtime:runtime-livedata",     version.ref = "compose" }
compose-ui                  = { module = "androidx.compose.ui:ui",                        version.ref = "compose" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling",                version.ref = "compose" }
compose-material3           = { module = "androidx.compose.material3:material3",          version.ref = "compose-material3" }
compose-material-icons      = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-material" }
compose-navigation          = { module = "androidx.navigation:navigation-compose",        version.ref = "compose-navigation" }
# Lifecycle
lifecycle-viewmodel-ktx     = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",    version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",version.ref = "lifecycle" }
lifecycle-runtime-ktx       = { module = "androidx.lifecycle:lifecycle-runtime-ktx",      version.ref = "lifecycle" }
# Room
room-runtime                = { module = "androidx.room:room-runtime",                    version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler",                   version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx",                        version.ref = "room" }
# Kotlin
kotlin-stdlib               = { module = "org.jetbrains.kotlin:kotlin-stdlib",            version.ref = "kotlin" }
coroutines-core             = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-reflect              = { module = "org.jetbrains.kotlin:kotlin-reflect",           version.ref = "kotlin" }
# Koin
koin-bom                    = { module = "io.insert-koin:koin-bom",                       version.ref = "koin" }
koin-android                = { module = "io.insert-koin:koin-android" }
koin-compose                = { module = "io.insert-koin:koin-androidx-compose" }
koin-test                   = { module = "io.insert-koin:koin-test-junit4",               version.ref = "koin" }
mockwebserver               = { module = "com.squareup.okhttp3:mockwebserver",            version.ref = "okhttp" }
# UI
timber                      = { module = "com.jakewharton.timber:timber",                 version.ref = "timber" }
osmdroid                    = { module = "org.osmdroid:osmdroid-android",                 version.ref = "osmdroid" }
mpandroidchart              = { module = "com.github.PhilJay:MPAndroidChart",             version.ref = "mpandroidchart" }
circleindicator             = { module = "me.relex:circleindicator",                      version.ref = "circleindicator" }
guava                       = { module = "com.google.guava:guava",                        version.ref = "guava" }
# EUC BLE
euc-ble-library             = { module = "io.github.tritbool:euc-ble-library",            version.ref = "euc-ble" }
# Test
junit                       = { module = "junit:junit",                                   version.ref = "junit" }
truth                       = { module = "com.google.truth:truth",                        version.ref = "truth" }
junit-jupiter               = { module = "org.junit.jupiter:junit-jupiter",               version.ref = "junit-jupiter" }
mockk                       = { module = "io.mockk:mockk",                               version.ref = "mockk" }
robolectric                 = { module = "org.robolectric:robolectric",                   version.ref = "robolectric" }
test-core                   = { module = "androidx.test:core",                            version.ref = "test-core" }
json                        = { module = "org.json:json",                                 version.ref = "json" }

[plugins]
android-application = { id = "com.android.application",                  version.ref = "agp" }
android-library     = { id = "com.android.library",                      version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",             version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",      version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",                  version.ref = "ksp" }
